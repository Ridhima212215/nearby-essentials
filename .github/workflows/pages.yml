# Publishes the app to GitHub Pages every time code is pushed to main.
# Based on GitHub's official "Static HTML" Pages workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Pages needs permission to publish
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # get the code
      - uses: actions/configure-pages@v5   # set up Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                          # publish the whole folder (index.html is at the top)
      - id: deployment
        uses: actions/deploy-pages@v4      # make it live
